# Deploys the production Worker (mountain-heritage-org-prod).
#
# Triggers:
#   - A semver tag push (vX.Y.Z) — developer promotion via the /deploy skill.
#   - A push to main whose commit is a CMS edit (message contains "[cms]") —
#     trustee edits in /admin go live automatically. The workflow waits for
#     a minute with no further CMS edits, then bumps the patch version, tags
#     the latest main, and deploys. A burst of saves becomes one release.
#
# Plain developer pushes to main (no tag, no [cms]) do nothing here; they only
# update staging via Cloudflare's own Git build.
#
# For [cms] edits that add images, this also runs `npm run images` to downsize
# the originals and regenerate AVIF/WebP variants, commits them back to main,
# and tags/deploys the optimised tree — so production is never served an
# unoptimised upload. See docs/images.md.
#
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# See docs/deployment.md and docs/plans/prod-releases.md.
name: Deploy production

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)deploy, e.g. v1.2.3 — for rollbacks.'
        required: true

# Concurrency is set per job (below), not for the whole workflow: the
# quiet-period wait must be cancellable by the next CMS edit, but a deploy
# that has started must never be cancelled half-way.

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      mode: ${{ steps.decide.outputs.mode }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - id: decide
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true"  >> "$GITHUB_OUTPUT"
            echo "mode=tag"      >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "deploy=true"  >> "$GITHUB_OUTPUT"
            echo "mode=tag"      >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$MSG" | grep -q '\[cms\]'; then
            echo "deploy=true"  >> "$GITHUB_OUTPUT"
            echo "mode=cms"      >> "$GITHUB_OUTPUT"
            # Release whatever main is when the quiet period ends, so the
            # edits from cancelled runs in the same burst are included.
            echo "ref=main"      >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  # Debounce trustee edits. Each [cms] push starts a 60s wait; a newer
  # [cms] push cancels the waiting one (cancel-in-progress), so only the
  # last save in a burst goes on to release. Tags and manual redeploys skip
  # this job.
  quiet-period:
    needs: decide
    if: needs.decide.outputs.mode == 'cms'
    runs-on: ubuntu-latest
    concurrency:
      group: cms-release-quiet-period
      cancel-in-progress: true
    steps:
      - run: sleep 60

  deploy:
    needs: [decide, quiet-period]
    # always() so a skipped quiet-period (tag / manual deploys) doesn't skip
    # this job; a cancelled one (superseded by a newer edit) still does.
    if: >-
      always() &&
      needs.decide.outputs.deploy == 'true' &&
      (needs.quiet-period.result == 'success' || needs.quiet-period.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.decide.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Nothing to do if this commit is already released (e.g. a developer
      # tagged it during the quiet period).
      - name: Check main has unreleased changes (CMS edits)
        id: unreleased
        if: needs.decide.outputs.mode == 'cms'
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*.*.*')" ]; then
            echo "HEAD is already released; nothing to deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Compress-on-ingest for trustee uploads. If any CMS edit since the
      # last release touched public/uploads, regenerate downsized originals + AVIF/WebP variants and
      # commit them back to main (so the repo stays lean and the tag below
      # points at the optimised tree). The commit is marked [skip-optimise] so
      # neither this workflow nor optimise-images.yml re-triggers. See
      # docs/images.md.
      - name: Optimise uploaded images (CMS edits)
        if: needs.decide.outputs.mode == 'cms' && steps.unreleased.outputs.skip != 'true'
        run: |
          # Compare against the last release, not just the previous commit:
          # a burst of edits is released together.
          before=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$before" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            before=HEAD~1
          fi
          if git diff --name-only "$before" HEAD | grep -q '^public/uploads/'; then
            npm run images
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/uploads public/variants src/content/images
            if git diff --cached --quiet; then
              echo "Images already optimised; nothing to commit."
            else
              git commit -m "optimise images [skip-optimise]"
              git push origin HEAD:main
            fi
          else
            echo "No upload changes in this commit; skipping image optimisation."
          fi

      - name: Tag the patch release (CMS edits)
        if: needs.decide.outputs.mode == 'cms' && steps.unreleased.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --quiet
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          ver=${latest#v}
          major=${ver%%.*}; rest=${ver#*.}; minor=${rest%%.*}; patch=${rest#*.}
          new="v${major}.${minor}.$((patch + 1))"
          echo "Tagging $new"
          git tag -a "$new" -m "content release $new"
          git push origin "$new"

      - run: npm run build
        if: steps.unreleased.outputs.skip != 'true'
        env:
          # Cloudflare Web Analytics site token. Public (it ends up in the
          # page HTML), so it lives here rather than in a secret. Set only
          # for production so staging traffic isn't counted. See
          # docs/analytics.md.
          PUBLIC_CF_WEB_ANALYTICS_TOKEN: b7ee2bc4e3bc46da99b3a9f650a8e1e6

      - name: Deploy to production Worker
        if: steps.unreleased.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploy the same build to a separate worker via an explicit name
          # override. The @astrojs/cloudflare adapter regenerates the wrangler
          # config and drops [env.*] blocks, so `--env production` would just
          # redeploy the staging worker. See docs/plans/prod-releases.md.
          command: deploy --name mountain-heritage-org-prod
